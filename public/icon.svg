<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Open Cards">
  <rect
    x="5"
    y="5"
    width="118"
    height="118"
    rx="18"
    fill="#ffffff"
    stroke="#656d76"
    stroke-width="5"
  />
  <!-- Typographic OC (matches Figma: ink O + Primer blue C), inset so strokes never clip -->
  <text
    x="64"
    y="86"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="-4"
  >
    <tspan fill="#1f2328">O</tspan><tspan fill="#0969da">C</tspan>
  </text>
</svg>
