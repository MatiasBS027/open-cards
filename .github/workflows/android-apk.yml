name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 still runs `sdkmanager tools`, which Google removed from the repo.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor (base /)
        env:
          VITE_BASE: /
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="dev"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "open-cards-${TAG}-debug.apk"
          echo "APK_NAME=open-cards-${TAG}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-cards-debug-apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          name: Open Cards ${{ github.ref_name }}
          body: |
            APK de depuración (Capacitor). Misma app local-first que la PWA; los datos viven en el dispositivo.
          fail_on_unmatched_files: true
