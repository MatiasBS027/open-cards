name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 still runs `sdkmanager tools`, which Google removed from the repo.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web + sync Capacitor (base /)
        env:
          VITE_BASE: /
        run: |
          pnpm exec tsc -b
          pnpm exec vite build
          pnpm exec cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 (release signing required)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/open-cards-release.jks"
          echo "OPEN_CARDS_KEYSTORE=$RUNNER_TEMP/open-cards-release.jks" >> "$GITHUB_ENV"

      - name: Resolve app version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # 0.1.6 → 106 so versionCode always increases with semver for this 0.x line
          CODE="$(node -p "const v=require('./package.json').version.split('.').map(Number); (v[0]*10000)+(v[1]*100)+v[2]")"
          echo "OPEN_CARDS_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "OPEN_CARDS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Resolved versionName=$VERSION versionCode=$CODE"

      - name: Assemble signed release APK
        working-directory: android
        env:
          OPEN_CARDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPEN_CARDS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPEN_CARDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$OPEN_CARDS_KEYSTORE_PASSWORD" ] || [ -z "$OPEN_CARDS_KEY_ALIAS" ] || [ -z "$OPEN_CARDS_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="dev"
          fi
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Release APK not found at $SRC"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          cp "$SRC" "open-cards-${TAG}.apk"
          echo "APK_NAME=open-cards-${TAG}.apk" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/open-cards-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-cards-apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          name: Open Cards ${{ github.ref_name }}
          body: |
            APK firmado (Capacitor). Misma app local-first; los datos viven en el dispositivo.

            Si venías de un APK `-debug` anterior (v0.1.0–v0.1.5), desinstalá primero: esas builds usaban otra firma y Android no permite actualizar encima.
          fail_on_unmatched_files: true
